  - { faixa: "<3%", risco: 1.0 }
  - { faixa: "3-5%", risco: 0.5 }
  - { faixa: ">=5%", acao: "pausa ate fim da semana + revisao escrita" }
  - { faixa: ">=7%", acao: "stop total" }
payout:
  regra: "mensal, SOMENTE o lucro acima de (pico de fechamento - US$ 4.000); Muse calcula e reporta ANTES do saque (pico, saldo, sacavel, liquido 90%, saldo pos-saque, distancia ao piso)"
  freio: "DD ajustado > US$ 6.000 = NAO sacar no ciclo"
  registro: "cada saque entra no Dashboard Trading (bloco withdrawals/break-even por conta; taxas US$ 919 x2 = US$ 1.838)"
scaling_ftmo:
  termos: "a cada 4 meses como FTMO Trader: >=10% de lucro liquido na janela + >=2 Rewards processados + saldo positivo -> conta +25% do saldo INICIAL (linear), teto US$ 2M somando contas; limites e R reancoram no tamanho novo"
