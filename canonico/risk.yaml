notificacao: "toda ENTRADA de trade e avisada ao Rafael na hora (ativo, conta, familia/motor, entrada, stop, alvos, R)"
revisao_trimestral: "cron revisao-trimestral-estrategia-trade (1a em 2027-02-27): re-mede expectancy, sobrevivencia e os kill criteria; regras duras so mudam com a palavra do Rafael"
